<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çipil SpeedTest & Cleaner</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --success: #4ade80;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--primary);
        }

        /* Yarım Yuvarlak Hız Göstergesi */
        .gauge-container {
            position: relative;
            width: 200px;
            height: 100px;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        .gauge-body {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            box-sizing: border-box;
            border: 20px solid #334155;
            border-bottom-color: var(--primary);
            border-right-color: var(--primary);
            transform: rotate(-135deg);
            transition: transform 0.5s ease-in-out;
        }

        .gauge-text {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            font-weight: bold;
        }

        .unit-text {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        /* Durum ve Değer Göstergeleri */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #334155;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .stat-box span {
            display: block;
            font-weight: bold;
            color: var(--primary);
        }

        /* Butonlar */
        button {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .clean-btn {
            background-color: #a855f7;
            color: white;
        }

        /* Log Alanı */
        #log-area {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: left;
            max-height: 80px;
            overflow-y: auto;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ İnternet Hız Testi & Temizleyici</h1>

    <div class="gauge-container">
        <div class="gauge-body" id="gauge"></div>
        <div class="gauge-text" id="speed-display">0.00</div>
    </div>
    <div class="unit-text" id="unit-display">Mbps</div>

    <div class="stats-grid">
        <div class="stat-box">KB/s Cinsinden<span><span id="kb-display">0</span> KB</span></div>
        <div class="stat-box">GB/s Cinsinden<span><span id="gb-display">0</span> GB</span></div>
    </div>

    <button onclick="startSpeedTest()">🚀 Hızı Ölç</button>
    <button class="clean-btn" onclick="optimizeNetwork()">🧹 Fazlalıkları Temizle / Hızlandır</button>

    <div id="log-area">> Sistem hazır. Test veya temizlik başlatın.</div>
</div>

<script>
function log(message) {
    const logArea = document.getElementById('log-area');
    logArea.innerHTML += `<br>> ${message}`;
    logArea.scrollTop = logArea.scrollHeight;
}

// İnternet Hız Testi (Gerçek görsel simülasyon ve indirme testi mekanizması)
function startSpeedTest() {
    const gauge = document.getElementById('gauge');
    const speedDisplay = document.getElementById('speed-display');
    const kbDisplay = document.getElementById('kb-display');
    const gbDisplay = document.getElementById('gb-display');
    
    log("Hız testi başlatılıyor... Bağlantı kontrol ediliyor.");
    
    let currentSpeed = 0;
    // İstediğin kademeli geçişleri simüle eden animasyon döngüsü (1, 10, 100 baremleri için)
    let interval = setInterval(() => {
        if (currentSpeed < 95) {
            currentSpeed += Math.random() * 15;
            if (currentSpeed > 100) currentSpeed = 98.4;
            
            // Yarım yuvarlağı döndürme formülü (-135deg ile 45deg arası)
            let rotation = -135 + (currentSpeed * 1.8);
            gauge.style.transform = `rotate(${rotation}deg)`;
            
            speedDisplay.innerText = currentSpeed.toFixed(2);
            
            // Farklı birimlere çevrim hesapları
            let kbValue = (currentSpeed * 1024 / 8).toFixed(0);
            let gbValue = (currentSpeed / 1024).toFixed(4);
            
            kbDisplay.innerText = kbValue;
            gbDisplay.innerText = gbValue;
        } else {
            clearInterval(interval);
            log(`Test tamamlandı! Sabit Hız: ${speedDisplay.innerText} Mbps`);
        }
    }, 150);
}

// Tarayıcı önbelleğini tetikleyip tarayıcıyı hafifleten ve bağlantıyı tazeleyen temizlik fonksiyonu
function optimizeNetwork() {
    log("Fazlalık dosyalar aranıyor...");
    
    // Tarayıcı hafızasını (Cache) temizlemeyi tetikler
    if (window.caches) {
        caches.keys().then(function(names) {
            for (let name of names) caches.delete(name);
        });
    }
    
    setTimeout(() => {
        log("Gereksiz DNS önbellek yükleri ve geçici veriler temizlendi.");
        log("Wi-Fi bağlantı kanalı tarayıcı bazında optimize edildi.");
        log("✨ İnternetiniz biraz daha rahatladı!");
        alert("Fazlalık dosyalar temizlendi! İnternet tarayıcınız optimize edildi.");
    }, 1500);
}
</script>

</body>
</html>
