<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çipil Master OS v1.5</title>
    <!-- PWA Meta Etiketleri -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#05070f">
    <style>
        :root { --bg-color: #05070f; --card-bg: #0f172a; --primary: #38bdf8; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: var(--card-bg); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #1e293b; }
        h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 20px; }
        button { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .info { margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h1>Çipil Master OS v1.5</h1>
    <div id="status">Sistem Hazır</div>
    
    <button onclick="installApp()">Uygulamayı Ana Ekrana Ekle</button>
    <div class="info">
        <p>Not: Bu arayüz, Bluetooth üzerinden kod yükleme ve sistem yönetimi için optimize edilmiştir.</p>
    </div>
</div>

<script>
    let deferredPrompt;

    // Uygulamayı yükleme tetikleyicisi
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                deferredPrompt = null;
            });
        } else {
            alert("Tarayıcınızın menüsünden 'Ana Ekrana Ekle' (Add to Home Screen) seçeneğine tıklayarak uygulamayı kurabilirsiniz.");
        }
    }

    // VS Code'dan Bluetooth ile bağlanma simülasyonu
    console.log("Çipil sistemine bağlandı. VS Code üzerinden gönderilen kodlar hazır.");
</script>

</body>
</html>
