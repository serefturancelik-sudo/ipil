```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çipil OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #05070f; color: #fff; font-family: sans-serif; }
    </style>
</head>
<body class="p-6 flex items-center justify-center min-h-screen">
    <div class="max-w-sm w-full bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center text-cyan-400 mb-8">Çipil Hız Analizi</h1>
        <div class="text-center mb-8">
            <div id="speed" class="text-6xl font-bold mb-2">0.0</div>
            <div class="text-cyan-500 font-bold tracking-widest">MBPS</div>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-800 p-4 rounded-xl text-center">
                <p class="text-[10px] text-slate-400">DOWNLOAD</p>
                <p id="down" class="font-bold">0.0 Mbps</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl text-center">
                <p class="text-[10px] text-slate-400">UPLOAD</p>
                <p id="up" class="font-bold">0.0 Mbps</p>
            </div>
        </div>
        <button id="btn" onclick="startTest()" class="w-full bg-cyan-600 py-4 rounded-xl font-bold text-lg hover:bg-cyan-500 transition">TESTİ BAŞLAT</button>
    </div>

    <script>
        async function startTest() {
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerText = "Ölçülüyor...";
            try {
                // Download
                const sD = performance.now();
                const rD = await fetch('https://speed.cloudflare.com/__down?bytes=5000000', {cache: 'no-store'});
                const bD = await rD.blob();
                const eD = performance.now();
                const dS = (bD.size * 8) / ((eD - sD) / 1000) / 1000000;
                document.getElementById('speed').innerText = dS.toFixed(1);
                document.getElementById('down').innerText = dS.toFixed(1) + " Mbps";
                // Upload
                const data = new Uint8Array(2000000);
                const sU = performance.now();
                await fetch('https://speed.cloudflare.com/__up', {method: 'POST', body: data});
                const eU = performance.now();
                const uS = (data.length * 8) / ((eU - sU) / 1000) / 1000000;
                document.getElementById('up').innerText = uS.toFixed(1) + " Mbps";
            } catch(e) { alert("Bağlantı hatası!"); }
            btn.disabled = false; btn.innerText = "TESTİ BAŞLAT";
        }
    </script>
</body>
</html>
