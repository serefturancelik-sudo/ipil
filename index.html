```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çipil OS v1.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gauge-body { border: 18px solid #1e293b; border-bottom-color: #38bdf8; border-right-color: #38bdf8; transform: rotate(-135deg); transition: transform 0.5s ease; }
    </style>
</head>
<body class="bg-gray-950 text-white flex justify-center p-4">
    <div class="bg-gray-900 p-6 rounded-3xl w-full max-w-sm border border-gray-800 text-center">
        <h1 class="text-xl font-bold mb-4 text-sky-400">Çipil Hız Testi</h1>
        
        <div class="w-48 h-24 mx-auto overflow-hidden relative mb-4">
            <div id="gauge" class="w-48 h-48 rounded-full gauge-body"></div>
            <div class="absolute bottom-0 w-full text-center"><span id="speed-display" class="text-2xl font-bold">0.0</span> <span class="text-xs">Mbps</span></div>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-4 text-sm">
            <div class="bg-gray-800 p-2 rounded">MB/s <span id="mb-val" class="block font-bold text-sky-400">0.00</span></div>
            <div class="bg-gray-800 p-2 rounded">Ping <span id="ping-val" class="block font-bold text-sky-400">0 ms</span></div>
        </div>

        <button id="test-btn" onclick="runTest()" class="w-full bg-sky-500 py-3 rounded-xl font-bold mb-2">Testi Başlat</button>
        <!-- Burayı GitHub'dan aldığın RAW linkle değiştir -->
        <a href="https://github.com/serefturancelik-sudo/cipil/raw/main/app-release.apk" class="block w-full bg-green-600 py-3 rounded-xl font-bold">🚀 APK İndir</a>
    </div>

    <script>
        function runTest() {
            const btn = document.getElementById('test-btn');
            btn.disabled = true;
            let i = 0;
            let timer = setInterval(() => {
                let speed = Math.random() * 80 + 10;
                document.getElementById('speed-display').innerText = speed.toFixed(1);
                document.getElementById('mb-val').innerText = (speed / 8).toFixed(2);
                document.getElementById('ping-val').innerText = Math.floor(Math.random() * 20 + 5) + " ms";
                document.getElementById('gauge').style.transform = `rotate(${-135 + (speed * 1.35)}deg)`;
                i++;
                if(i > 15) { clearInterval(timer); btn.disabled = false; }
            }, 200);
        }
    </script>
</body>
</html>
