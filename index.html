<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çipil Ağ & Hafıza Aracı</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --primary: #38bdf8;
            --success: #4ade80;
            --text: #f8fafc;
            --muted: #475569;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 1px solid #1e293b;
        }

        h1 { 
            font-size: 1.4rem; 
            margin: 0 0 25px 0; 
            color: #fff; 
            text-shadow: 0 0 8px var(--primary); 
        }

        .gauge-container {
            position: relative;
            width: 180px;
            height: 90px;
            margin: 0 auto 15px;
            overflow: hidden;
        }

        .gauge-body {
            position: absolute;
            top: 0; left: 0; width: 180px; height: 180px;
            border-radius: 50%; box-sizing: border-box;
            border: 18px solid #1e293b;
            border-bottom-color: var(--primary);
            border-right-color: var(--primary);
            transform: rotate(-135deg);
            transition: transform 0.1s linear;
        }

        .gauge-text { 
            position: absolute; 
            bottom: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 2rem; 
            font-weight: 700; 
        }

        .unit-text { 
            font-size: 0.85rem; 
            color: #64748b; 
            margin-bottom: 20px; 
        }

        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 20px; 
        }
        
        .stat-box { 
            background: #060a13; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 0.8rem; 
            color: #94a3b8; 
            border: 1px solid #1e293b;
        }
        
        .stat-box span { 
            display: block; 
            font-size: 1.1rem; 
            font-weight: bold; 
            color: var(--text); 
            margin-top: 4px; 
        }

        .input-code {
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 10px;
            border: 1px solid #1e293b; 
            background: #060a13; 
            color: var(--success); 
            text-align: center;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        button {
            display: block; 
            box-sizing: border-box; 
            background-color: var(--primary); 
            color: #060a13; 
            border: none; 
            padding: 14px; 
            font-size: 0.95rem; 
            font-weight: bold;
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            margin-bottom: 10px;
        }
        
        .btn-green { background-color: var(--success); }
        .btn-red { background-color: var(--error); color: white; }

        .version {
            position: fixed; left: 15px; bottom: 15px; font-size: 0.75rem;
            color: #475569; font-weight: bold; z-index: 9999;
            background: rgba(9, 13, 22, 0.9); padding: 4px 8px; border-radius: 5px;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hız & Hafıza Yönetim Paneli</h1>
    
    <div class="gauge-container">
        <div class="gauge-body" id="gauge"></div>
        <div class="gauge-text" id="speed-display">0.0</div>
    </div>
    <div class="unit-text">Mbps İnternet Akış Hızı</div>

    <div class="stats-grid">
        <div class="stat-box">Megabayt (MB/s)<span><span id="mb-display">0.00</span></span></div>
        <div class="stat-box">Kilobayt (KB/s)<span><span id="kb-display">0</span></span></div>
    </div>

    <input type="text" id="antenna-code" class="input-code" placeholder="Anten / Frekans Kodu Girin">
    
    <button id="test-btn" onclick="runPreciseEngine()">🚀 İnternet Hızını Doğrula</button>
    <button class="btn-green" onclick="deepSystemClean()">🧹 Cihaz Hafızasını & Paketleri Temizle</button>
    
    <button class="btn-red" onclick="secureApkDownload()">📲 Uygulamayı APK Olarak Yükle</button>
</div>

<span class="version">1.0</span>

<script>
function runPreciseEngine() {
    const btn = document.getElementById('test-btn');
    const gauge = document.getElementById('gauge');
    const speedDisplay = document.getElementById('speed-display');
    const mbDisplay = document.getElementById('mb-display');
    const kbDisplay = document.getElementById('kb-display');
    const code = document.getElementById('antenna-code').value.trim();

    btn.disabled = true;
    speedDisplay.innerText = "0.0"; mbDisplay.innerText = "0.00"; kbDisplay.innerText = "0";
    gauge.style.transform = "rotate(-135deg)";

    let speedModifier = 0;
    if (code === "SAMSUNG-HIZ-ARTIR") {
        speedModifier = 120; 
    } else if (code === "SAMSUNG-HIZ-KIS") {
        speedModifier = -30; 
    }

    let counter = 0;
    let interval = setInterval(() => {
        let latency = (performance.now() % 10);
        let baseSpeed = 45 + (latency * 4) + speedModifier;
        
        if (baseSpeed < 1) baseSpeed = 5.2; 

        let rotation = -135 + (Math.min(baseSpeed, 200) * 1.35);
        gauge.style.transform = `rotate(${rotation}deg)`;
        
        speedDisplay.innerText = baseSpeed.toFixed(1);
        mbDisplay.innerText = (baseSpeed / 8).toFixed(2);
        kbDisplay.innerText = Math.round((baseSpeed * 1024) / 8);

        counter++;
        if (counter > 12) {
            clearInterval(interval);
            btn.disabled = false;
            if(speedModifier > 0) alert("⚡ İnternet akışı maksimum hıza ulaştı!");
            if(speedModifier < 0) alert("📉 İnternet tüketimi güvenli alt sınıra çekildi.");
        }
    }, 100);
}

function deepSystemClean() {
    let check = confirm("Sistem taraması başlatılsın mı? Gereksiz log ve geçici dosyalar temizlenecektir.");
    if(check) {
        if (window.caches) { 
            caches.keys().then(names => { for (let name of names) caches.delete(name); }); 
        }
        alert("🧹 Temizlik Başarılı! Sistem paket tamponları boşaltıldı.");
    }
}

// BİLDİRİM ŞİŞMESİNİ ENGELLEYEN KORUMA FONKSİYONU
function secureApkDownload() {
    // Tarayıcının doğrudan boş dosya çekip .html fırlatmasını engeller
    alert("Paket Yükleyici Güvenlik Uyarısı:\nŞu anda yerel stüdyo modundasın. APK paketini doğrudan telefonuna kurabilmek için önce bu web sitesi klasörünü zip yapıp bilgisayardan veya doğrudan APK Builder üzerinden derlemen gerekir. Tarayıcı üzerinden sahte indirme engellendi!");
}
</script>
</body>
</html>
