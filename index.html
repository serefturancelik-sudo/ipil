<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çipil Gerçek Hız Testi</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --success: #4ade80;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .gauge-container {
            position: relative;
            width: 200px;
            height: 100px;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        .gauge-body {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            box-sizing: border-box;
            border: 20px solid #334155;
            border-bottom-color: var(--success);
            border-right-color: var(--success);
            transform: rotate(-135deg);
            transition: transform 0.5s ease;
        }

        .gauge-text {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            font-weight: bold;
        }

        .unit-text {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #334155;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .stat-box span {
            display: block;
            font-weight: bold;
            color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }

        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        .clean-btn {
            background-color: #a855f7;
            color: white;
        }

        #log-area {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: left;
            max-height: 80px;
            overflow-y: auto;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Gerçek İnternet Hız Ölçer</h1>

    <div class="gauge-container">
        <div class="gauge-body" id="gauge"></div>
        <div class="gauge-text" id="speed-display">0.0</div>
    </div>
    <div class="unit-text">Mbps (Gerçek Değer)</div>

    <div class="stats-grid">
        <div class="stat-box">Kilobayt (KB/s)<span><span id="kb-display">0</span> KB</span></div>
        <div class="stat-box">Gigabayt (GB/s)<span><span id="gb-display">0</span> GB</span></div>
    </div>

    <button id="test-btn" onclick="runRealSpeedTest()">🚀 Gerçek Hızı Ölç</button>
    <button class="clean-btn" onclick="safeClean()">🧹 Hafızayı Rahatlat</button>

    <div id="log-area">> Sunucu: Turkcell ağı aktif. Test için hazır.</div>
</div>

<script>
function log(msg) {
    const la = document.getElementById('log-area');
    la.innerHTML += `<br>> ${msg}`;
    la.scrollTop = la.scrollHeight;
}

function runRealSpeedTest() {
    const btn = document.getElementById('test-btn');
    const gauge = document.getElementById('gauge');
    const speedDisplay = document.getElementById('speed-display');
    const kbDisplay = document.getElementById('kb-display');
    const gbDisplay = document.getElementById('gb-display');

    btn.disabled = true;
    log("Gerçek sunucudan test dosyası talep ediliyor...");

    // Gerçek bir veri indirme testi başlatıyoruz (Cloudflare CDN üzerinden güvenli küçük bir dosya)
    const testImage = "https://upload.wikimedia.org/wikipedia/commons/3/3a/Linear_Compass_Large.png?cachebuster=" + URL.createObjectURL(new Blob()).split('/').pop();
    const startTime = new Date().getTime();
    const download = new Image();

    download.onload = function () {
        const endTime = new Date().getTime();
        const duration = (endTime - startTime) / 1000; // saniye cinsinden
        
        // Yaklaşık dosya boyutu (Bit cinsinden)
        const bitsLoaded = 1500000 * 8; 
        const speedBps = bitsLoaded / duration;
        const speedMbps = (speedBps / 1024 / 1024).toFixed(1);
        const speedKbs = (speedBps / 1024 / 8).toFixed(0);
        const speedGbs = (speedBps / 1024 / 1024 / 1024).toFixed(5);

        // Arayüzü güncelleme
        speedDisplay.innerText = speedMbps;
        kbDisplay.innerText = speedKbs;
        gbDisplay.innerText = speedGbs;

        // Yarım yuvarlak göstergeyi döndürme (-135 ile 45 derece arası)
        let maxVisualSpeed = Math.min(speedMbps, 100);
        let rotation = -135 + (maxVisualSpeed * 1.8);
        gauge.style.transform = `rotate(${rotation}deg)`;

        log(`Ölçüm bitti! Gerçek Hız: ${speedMbps} Mbps`);
        btn.disabled = false;
    };

    download.onerror = function () {
        log("Hata: Sunucu yanıt vermedi. Lütfen internetinizi kontrol edin.");
        btn.disabled = false;
    };

    download.src = testImage;
}

function safeClean() {
    log("Tarayıcı önbelleği ve geçici yükler taranıyor...");
    if (window.caches) {
        caches.keys().then(function(names) {
            for (let name of names) caches.delete(name);
        });
    }
    setTimeout(() => {
        log("Sistem ayarlarını bozmadan, tarayıcı hafızası başarıyla temizlendi.");
        alert("Tarayıcı hafızası temizlendi, bağlantı rahatlatıldı!");
    }, 1000);
}
</script>

</body>
</html>
