<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnternet Optimizasyon Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ağ Hızlandırma & Optimizasyon</h1>
        <hr>
        
        <div class="status-box">
            <p><strong>Mevcut Bağlantı Durumu:</strong> <span id="connection-status">Ölçülüyor...</span></p>
            <p><strong>Anlık Gecikme (Ping):</strong> <span id="ping-value">-- ms</span></p>
        </div>

        <button onclick="optimizeConnection()" class="btn-optimize">Bağlantıyı Optimize Et (Hızlandır)</button>
        <button onclick="cleanCache()" class="btn-clean">Web Önbelleğini Temizle</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
