<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hız Testi & AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --success: #4ade80;
            --text: #f8fafc;
            --muted: #64748b;
            --ai-color: #a855f7;
            --apk-color: #eab308;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 420px;
            margin-bottom: 15px;
        }

        h1 { font-size: 1.5rem; margin: 0 0 20px 0; }
        h2 { font-size: 1.1rem; color: var(--primary); margin: 0 0 10px 0; text-align: left; }

        .gauge-container {
            position: relative;
            width: 200px;
            height: 100px;
            margin: 0 auto 15px;
            overflow: hidden;
        }

        .gauge-body {
            position: absolute;
            top: 0; left: 0; width: 200px; height: 200px;
            border-radius: 50%; box-sizing: border-box;
            border: 20px solid #334155;
            border-bottom-color: var(--primary);
            border-right-color: var(--primary);
            transform: rotate(-135deg);
            transition: transform 0.1s linear;
        }

        .gauge-text { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); font-size: 2rem; font-weight: 700; }
        .unit-text { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #0f172a; padding: 10px; border-radius: 10px; font-size: 0.8rem; color: #94a3b8; }
        .stat-box span { display: block; font-size: 1rem; font-weight: bold; color: var(--text); margin-top: 4px; }

        button, .apk-download-link {
            display: block;
            box-sizing: border-box;
            background-color: var(--primary); color: #0f172a; border: none;
            padding: 14px; font-size: 0.95rem; font-weight: bold;
            border-radius: 12px; cursor: pointer; width: 100%; margin-bottom: 10px;
            text-decoration: none; text-align: center;
        }
        .btn-green { background-color: var(--success); }
        .btn-purple { background-color: var(--ai-color); color: white; }
        
        .btn-apk { 
            background-color: var(--apk-color); 
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3);
        }

        .secret-input {
            width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px;
            border: 1px solid #334155; background: #0f172a; color: var(--success); text-align: center;
        }

        .ai-chat-log { background: #0f172a; height: 100px; overflow-y: auto; padding: 8px; border-radius: 8px; font-size: 0.8rem; text-align: left; margin-bottom: 8px; }
        .ai-input-group { display: flex; gap: 5px; }
        .ai-input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }

        /* Sol en alttaki temiz alanda duran Sayaçlı Versiyon */
        .version {
            position: fixed; left: 20px; bottom: 20px; font-size: 0.8rem;
            color: var(--muted); font-weight: bold; z-index: 9999;
            background: rgba(15,23,42,0.8); padding: 4px 8px; border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hız Testi Merkezi</h1>
    <div class="gauge-container">
        <div class="gauge-body" id="gauge"></div>
        <div class="gauge-text" id="speed-display">0.0</div>
    </div>
    <div class="unit-text">Mbps (Megabit)</div>

    <div class="stats-grid">
        <div class="stat-box">Megabayt (MB/s)<span><span id="mb-display">0.00</span> MB/s</span></div>
        <div class="stat-box">Kilobayt (KB/s)<span><span id="kb-display">0</span> KB/s</span></div>
    </div>

    <input type="text" id="secret-code" class="secret-input" placeholder="Promosyon / Anten Kodu Girin">
    
    <button id="test-btn" onclick="runNetworkTest()">🚀 Sıfırdan Ölç</button>
    <button class="btn-green" onclick="deepCleanFiles()">🧹 Hafıza ve Uygulama Temizleyici</button>
    
    <a href="app-release.apk" class="apk-download-link btn-apk" download>🤖 Gerçek APK Dosyasını İndir</a>
</div>

<div class="container">
    <div class="ai-box" style="text-align: left;">
        <h2>🤖 Gemini AI Odası (Aboneliksiz Sürüm)</h2>
        <div class="ai-chat-log" id="ai-log">
            <span style="color:var(--ai-color)">[Gemini]:</span> Selam! Tamamen ücretsiz versiyonumla buradayım. Bana her şeyi sorabilirsin, kod veya cihaz analizi yapabilirim.
        </div>
        <div class="ai-input-group">
            <input type="text" id="ai-input" class="ai-input" placeholder="Gemini'ye sorun...">
            <button class="btn-purple" style="width:auto; margin:0;" onclick="askGemini()">Sor</button>
        </div>
    </div>
</div>

<span class="version">v: 0.06</span>

<script>
let antennaBoost = false;

function runNetworkTest() {
    const btn = document.getElementById('test-btn');
    const gauge = document.getElementById('gauge');
    const speedDisplay = document.getElementById('speed-display');
    const mbDisplay = document.getElementById('mb-display');
    const kbDisplay = document.getElementById('kb-display');
    const codeInput = document.getElementById('secret-code').value.trim();

    btn.disabled = true;
    speedDisplay.innerText = "0.0";
    mbDisplay.innerText = "0.00";
    kbDisplay.innerText = "0";
    gauge.style.transform = "rotate(-135deg)";

    let antennaBoost = (codeInput === "SAMSUNG-ANTEN-77" || codeInput === "A23-BOOST");
    let counter = 0;
    
    let interval = setInterval(() => {
        let latency = performance.now() % 10;
        let baseSpeed = 45 + (latency * 4);
        if (antennaBoost) baseSpeed += 130; 

        let rotation = -135 + (Math.min(baseSpeed, 200) * 1.35);
        gauge.style.transform = `rotate(${rotation}deg)`;
        
        speedDisplay.innerText = baseSpeed.toFixed(1);
        mbDisplay.innerText = (baseSpeed / 8).toFixed(2);
        kbDisplay.innerText = Math.round((baseSpeed * 1024) / 8);

        counter++;
        if (counter > 15) {
            clearInterval(interval);
            btn.disabled = false;
        }
    }, 100);
}

function deepCleanFiles() {
    let q1 = confirm("Sistem Analizi: 'Com.samsung.android.mate' (Kullanılmayan Paket) tespit edildi. Silinsin mi?");
    if(q1) {
        let q2 = confirm("Tarayıcı gizli log ve tampon hafızası boşaltılsın mı?");
        if(q2) {
            if (window.caches) { caches.keys().then(names => { for (let name of names) caches.delete(name); }); }
            alert("Seçilen uygulamalar ve gereksiz dosyalar temizlendi! Donanım rahatlatıldı.");
        }
    } else {
        alert("Hiçbir dosyaya dokunulmadı.");
    }
}

function askGemini() {
    const input = document.getElementById('ai-input');
    const aiLog = document.getElementById('ai-log');
    const prompt = input.value.trim();
    if (!prompt) return;

    aiLog.innerHTML += `<br><br><span style='color:var(--primary)'>[Sen]:</span> ${prompt}`;
    input.value = "";

    setTimeout(() => {
        let response = "Sorduğun soru %100 doğruluk payıyla analiz edildi: ";
        if (prompt.toLowerCase().includes("hız")) {
            response += "Şu an anten kısıtlamaları bypass edildi, port verileri optimize.";
        } else {
            response += "Samsung A23 donanım mimarisi hatasız entegre çalışıyor.";
        }
        aiLog.innerHTML += `<br><br><span style='color:var(--ai-color)'>[Gemini]:</span> ${response}`;
        aiLog.scrollTop = aiLog.scrollHeight;
    }, 800);
}
</script>
</body>
</html>
